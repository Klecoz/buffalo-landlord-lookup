<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buffalo Landlord Lookup</title>
  <!-- No mark yet; an empty icon stops the browser's automatic /favicon.ico
       request, which 404s on every page load. -->
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="masthead">
    <h1 class="masthead-title">Buffalo Landlord Lookup</h1>
    <p class="masthead-meta" id="issue-date">Public records · Buffalo, N.Y.</p>
  </header>

  <div id="search-row">
    <input
      type="search"
      id="search"
      placeholder="Search Buffalo addresses"
      autocomplete="off"
    />
    <ul id="search-results"></ul>
  </div>

  <div id="map"></div>

  <button id="reopen-panel" class="hidden">Top landlords</button>
  <div id="filter-chip" class="hidden" role="button" tabindex="0"></div>

  <aside id="panel" class="hidden">
    <div class="panel-handle" role="button" tabindex="0" aria-label="Resize panel"><span></span></div>
    <button id="panel-collapse" type="button" aria-label="Collapse panel" title="Collapse panel">‹</button>
    <button id="panel-close" aria-label="Close">&times;</button>
    <div id="panel-content"></div>
  </aside>

  <div id="legend" class="legend">
    <span class="legend-label-left">Open code violations</span>
    <span class="legend-ramp" aria-hidden="true">
      <span class="legend-step s0"></span>
      <span class="legend-step s1"></span>
      <span class="legend-step s2"></span>
      <span class="legend-step s3"></span>
      <span class="legend-step s4"></span>
    </span>
    <span class="legend-ticks">
      <span>none</span><span>5+</span><span>11+</span><span>demolished</span>
    </span>
    <span class="legend-note">demolished = permit + vacant lot</span>
  </div>

  <footer class="colophon">
    <span id="meta-info">Loading&hellip;</span>
    <span class="sep">·</span>
    <span>data.buffalony.gov, NYS GIS Clearinghouse</span>
    <span class="sep">·</span>
    <span>Research tool, not legal advice</span>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js" onerror="void 0"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
